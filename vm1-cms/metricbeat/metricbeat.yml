name: vm1-cms

metricbeat.modules:
  - module: system
    period: 10s
    hostfs: /hostfs
    metricsets:
      - cpu
      - load
      - memory
      - network
      - process
      - process_summary
      - uptime
    process.include_top_n:
      by_cpu: 5
      by_memory: 5

  - module: system
    period: 1m
    hostfs: /hostfs
    metricsets:
      - filesystem
      - fsstat
    processors:
      - drop_event.when.regexp:
          system.filesystem.mount_point: '^/(sys|cgroup|proc|dev|etc|host|lib|snap)($|/)'

  - module: nginx
    period: 10s
    metricsets: ["stubstatus"]
    hosts: ["http://nginx"]
    server_status_path: "server-status"

  - module: mysql
    period: 10s
    metricsets: ["status"]
    hosts: ["metricbeat:metricbeat_pass@tcp(mysql:3306)/"]

output.elasticsearch:
  hosts: ["${ES_HOST}"]

setup.template.settings:
  index.number_of_replicas: 0

logging.level: info
